name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        env:
          SOURCE_WORKER_URL: ${{ vars.SOURCE_WORKER_URL }}
        run: |
          mkdir -p site
          cp index.html styles.css redirect.js site/
          cp -R assets site/assets
          if [ -f CNAME ]; then cp CNAME site/; fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          value = os.environ['SOURCE_WORKER_URL'].strip().rstrip('/')
          parsed = urlparse(value)
          if value and (parsed.scheme != 'https' or not parsed.netloc or parsed.path or parsed.query or parsed.fragment):
              raise SystemExit('SOURCE_WORKER_URL must be an HTTPS origin')
          Path('site/worker-config.js').write_text('window.SOURCE_WORKER_URL = ' + json.dumps(value) + ';\n')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
